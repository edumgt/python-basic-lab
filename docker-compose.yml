services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pycap-backend
    environment:
      WORKSPACE_ROOT: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8877:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pycap-frontend
    depends_on:
      - backend
    ports:
      - "8878:80"
